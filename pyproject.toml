[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phenolapseuav"
version = "0.1.0"
description = "Interactive landmark-based registration of multispectral and infrared UAV orthomosaics in napari"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Romain Fernandez" },
    { name = "Serigne Mansour Diene" },
    { name = "Alain Audebert" },
]
keywords = ["napari", "image registration", "UAV", "orthomosaic", "multispectral", "infrared", "thin-plate spline", "phenotyping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "affine>=2.4",
    "napari>=0.5.6",
    "numpy>=1.26",
    "pyproj>=3.5",
    "qtpy>=2.4",
    "rasterio>=1.3",
    "scikit-image>=0.26",
]

[project.optional-dependencies]
automatic = ["arosics>=1.4", "matplotlib>=3.8", "opencv-python-headless>=4.9"]
dev = ["build>=1.2", "npe2>=0.7.7", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "twine>=5"]

[project.urls]
Homepage = "https://github.com/Rocsg/phenolapseUAV"
Repository = "https://github.com/Rocsg/phenolapseUAV"
Issues = "https://github.com/Rocsg/phenolapseUAV/issues"
Documentation = "https://github.com/Rocsg/phenolapseUAV#readme"

[project.scripts]
phenolapseUAV = "napari_tps_register:main"
phenolapseUAV-register-pair = "register_orthomosaics:main"
phenolapseUAV-register-series = "register_series:main"

[project.entry-points."napari.manifest"]
phenolapseuav = "phenolapseuav:napari.yaml"

[tool.setuptools]
packages = ["phenolapseuav"]
py-modules = ["napari_tps_register", "register_orthomosaics", "register_series", "series_registration"]
include-package-data = true

[tool.setuptools.package-dir]
phenolapseuav = "src/phenolapseuav"

[tool.setuptools.package-data]
phenolapseuav = ["napari.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests", "."]

[tool.coverage.run]
source = ["phenolapseuav", "napari_tps_register", "series_registration"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
